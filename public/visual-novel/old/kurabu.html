<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kurabu 2026</title>
    <style>
      :root {
        --panel: rgba(6, 16, 30, 0.92);
        --border: rgba(255, 255, 255, 0.14);
        --text: #f8fbff;
        --muted: rgba(248, 251, 255, 0.7);
        --accent: #159dda;
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      body {
        background: #07182b;
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
        user-select: none;
      }

      .app {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #07182b;
      }

      .background {
        position: absolute;
        inset: 0;
        background-size: 100% 100%;
        background-position: center;
        background-repeat: no-repeat;
        transition:
          background-image 0.4s ease,
          background 0.4s ease;
      }

      .background {
        background-repeat: no-repeat !important;
        background-position: center center !important;
        background-size: 100% 100% !important;
      }
      .background::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          180deg,
          rgba(0, 0, 0, 0.08),
          rgba(0, 0, 0, 0.42)
        );
        pointer-events: none;
      }

      .progress {
        position: absolute;
        top: 12px;
        right: 14px;
        z-index: 50;
        padding: 6px 9px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.28);
        color: rgba(255, 255, 255, 0.78);
        font-size: 11px;
        font-weight: 700;
        backdrop-filter: blur(8px);
      }

      /* =========================================================
       CHARACTER STAGE
       Setiap karakter masuk ke slot sendiri supaya tidak tabrakan.
       ========================================================= */
      .stage {
        position: absolute;
        inset: 8px 0 156px;
        z-index: 10;
        overflow: hidden;
        pointer-events: none;
      }

      .character {
        position: absolute;
        bottom: 0;
        height: 100%;
        width: 30%;
        object-fit: contain;
        object-position: center bottom;
        opacity: 0;
        filter: drop-shadow(0 18px 28px rgba(0, 0, 0, 0.35));
        transform: translateY(18px) scale(var(--char-scale, 0.96));
        transition:
          opacity 0.25s ease,
          transform 0.25s ease,
          filter 0.25s ease;
      }

      .character.visible {
        opacity: 0.48;
        transform: translateY(0) scale(var(--char-scale, 1));
      }

      .character.dim {
        opacity: 0.64;
      }

      .character.active {
        opacity: 0.98;
        transform: translateY(0) scale(var(--char-active-scale, 1.035));
        z-index: 5;
      }

      /* =========================================================
       CHARACTER EXPRESSIONS
       Animasi dipasang ulang tiap dialog agar ekspresi selalu terasa.
       ========================================================= */
      .character.expr-happy {
        animation: exprHappy 0.55s ease both;
      }
      .character.expr-excited {
        animation: exprExcited 0.55s ease both;
      }
      .character.expr-surprise {
        animation: exprSurprise 0.42s ease both;
      }
      .character.expr-angry {
        animation: exprAngry 0.36s ease both;
      }
      .character.expr-shy {
        animation: exprShy 0.65s ease both;
      }
      .character.expr-deadpan {
        animation: exprDeadpan 0.45s ease both;
      }

      @keyframes exprHappy {
        0% {
          transform: translateY(0) scale(var(--char-active-scale, 1.035));
        }
        35% {
          transform: translateY(-18px) scale(1.07);
        }
        65% {
          transform: translateY(-5px) scale(1.05);
        }
        100% {
          transform: translateY(0) scale(var(--char-active-scale, 1.035));
        }
      }

      @keyframes exprExcited {
        0% {
          transform: translateY(0) scale(1.035) rotate(0deg);
        }
        25% {
          transform: translateY(-10px) scale(1.075) rotate(-1.5deg);
        }
        55% {
          transform: translateY(-4px) scale(1.06) rotate(1.5deg);
        }
        100% {
          transform: translateY(0) scale(1.035) rotate(0deg);
        }
      }

      @keyframes exprSurprise {
        0% {
          transform: translateY(0) scale(var(--char-active-scale, 1.035));
        }
        30% {
          transform: translateY(-14px) scale(1.09);
        }
        100% {
          transform: translateY(0) scale(var(--char-active-scale, 1.035));
        }
      }

      @keyframes exprAngry {
        0%,
        100% {
          transform: translateX(0) translateY(0) scale(1.035);
        }
        20% {
          transform: translateX(-9px) translateY(0) scale(1.045);
        }
        40% {
          transform: translateX(9px) translateY(0) scale(1.045);
        }
        60% {
          transform: translateX(-6px) translateY(0) scale(1.045);
        }
        80% {
          transform: translateX(6px) translateY(0) scale(1.045);
        }
      }

      @keyframes exprShy {
        0% {
          transform: translateY(0) scale(var(--char-active-scale, 1.035));
        }
        40% {
          transform: translateY(10px) scale(0.995) rotate(-1deg);
        }
        100% {
          transform: translateY(0) scale(var(--char-active-scale, 1.035));
        }
      }

      @keyframes exprDeadpan {
        0% {
          transform: translateY(0) scale(var(--char-active-scale, 1.035));
        }
        45% {
          transform: translateY(5px) scale(1.005);
        }
        100% {
          transform: translateY(0) scale(var(--char-active-scale, 1.035));
        }
      }

      /* 1 CHARACTER */
      .stage.layout-1 .slot-1 {
        left: 25%;
        width: 50%;
      }

      /* 2 CHARACTERS */
      .stage.layout-2 .slot-1 {
        left: 4%;
        width: 42%;
      }
      .stage.layout-2 .slot-2 {
        left: 54%;
        width: 42%;
      }

      /* 3 CHARACTERS - dibuat sedikit overlap supaya idol tidak terlalu kecil */
      .stage.layout-3 .slot-1 {
        left: -3%;
        width: 38%;
      }
      .stage.layout-3 .slot-2 {
        left: 30.5%;
        width: 38%;
      }
      .stage.layout-3 .slot-3 {
        left: 64%;
        width: 38%;
      }

      /* 4 CHARACTERS - tetap muat tapi sedikit bertumpuk agar terlihat lebih besar */
      .stage.layout-4 .slot-1 {
        left: -4%;
        width: 31%;
      }
      .stage.layout-4 .slot-2 {
        left: 21%;
        width: 31%;
      }
      .stage.layout-4 .slot-3 {
        left: 46%;
        width: 31%;
      }
      .stage.layout-4 .slot-4 {
        left: 71%;
        width: 31%;
      }

      /* Normalisasi visual 4 karakter.
         Source PNG tiap karakter bisa punya ruang transparan berbeda,
         jadi skala per karakter dibuat lebih seimbang. */
      .stage.layout-4 #char-manager {
        --char-scale: 1.02;
        --char-active-scale: 1.055;
      }
      .stage.layout-4 #char-eve {
        --char-scale: 1.02;
        --char-active-scale: 1.055;
      }
      .stage.layout-4 #char-ai {
        --char-scale: 1.02;
        --char-active-scale: 1.055;
      }
      .stage.layout-4 #char-aya {
        --char-scale: 1;
        --char-active-scale: 1.035;
      }

      /* =========================================================
       EXPRESSION PARTICLE BUBBLE
       Particle mengikuti posisi kepala karakter yang sedang aktif.
       Asset:
       /visual-novel/particles/happy.png
       /visual-novel/particles/sad.png
       /visual-novel/particles/angry.png
       ========================================================= */
      .expression-particle {
        position: absolute;
        z-index: 25;
        width: clamp(110px, 14vw, 190px);
        height: auto;
        object-fit: contain;
        pointer-events: none;
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.72);
        transform-origin: center;
        filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.2));
        transition:
          left 0.22s ease,
          top 0.22s ease,
          opacity 0.18s ease,
          transform 0.22s ease;
      }

      .expression-particle.visible {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
        animation: particleFloat 1.8s ease-in-out infinite;
      }

      .expression-particle.particle-angry {
        animation: particleAngry 0.46s ease-in-out infinite alternate;
      }

      .expression-particle.particle-sad {
        animation: particleSad 2.1s ease-in-out infinite;
      }

      .expression-particle.particle-happy {
        animation: particleHappy 1.35s ease-in-out infinite;
      }

      @keyframes particleFloat {
        0%,
        100% {
          transform: translate(-50%, -50%) translateY(0) scale(1);
        }
        50% {
          transform: translate(-50%, -50%) translateY(-7px) scale(1.035);
        }
      }

      @keyframes particleHappy {
        0%,
        100% {
          transform: translate(-50%, -50%) translateY(0) scale(1);
        }
        50% {
          transform: translate(-50%, -50%) translateY(-9px) scale(1.07);
        }
      }

      @keyframes particleSad {
        0%,
        100% {
          transform: translate(-50%, -50%) translateY(0) scale(0.98);
          opacity: 0.9;
        }
        50% {
          transform: translate(-50%, -50%) translateY(5px) scale(1.02);
          opacity: 1;
        }
      }

      @keyframes particleAngry {
        0% {
          transform: translate(-50%, -50%) translateX(-3px) rotate(-3deg)
            scale(1);
        }
        100% {
          transform: translate(-50%, -50%) translateX(3px) rotate(3deg)
            scale(1.05);
        }
      }

      /* =========================================================
       DIALOGUE
       ========================================================= */
      .dialogue {
        position: absolute;
        left: 14px;
        right: 14px;
        bottom: 14px;
        z-index: 30;
        padding: 15px;
        border: 1px solid var(--border);
        border-radius: 22px;
        background: var(--panel);
        box-shadow: 0 18px 42px rgba(0, 0, 0, 0.32);
        backdrop-filter: blur(14px);
      }

      .speaker {
        display: inline-flex;
        align-items: center;
        min-height: 32px;
        padding: 7px 13px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.09);
        font-size: 13px;
        font-weight: 800;
      }

      .speaker.narrator {
        background: rgba(21, 157, 218, 0.16);
        color: #bde8ff;
      }

      .text-box {
        margin-top: 10px;
        min-height: 70px;
        color: var(--text);
        font-size: 17px;
        line-height: 1.55;
      }

      .actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-top: 10px;
      }

      .hint {
        color: var(--muted);
        font-size: 12px;
      }

      .controls {
        display: flex;
        gap: 8px;
      }

      button {
        min-height: 42px;
        border: 0;
        border-radius: 999px;
        padding: 10px 16px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 800;
        transition:
          transform 0.15s ease,
          opacity 0.15s ease;
      }

      button:hover {
        transform: translateY(-1px);
      }
      button:active {
        transform: translateY(0);
      }
      button:disabled {
        cursor: default;
      }

      .secondary {
        background: rgba(255, 255, 255, 0.09);
        color: #fff;
      }

      .primary {
        background: var(--accent);
        color: #fff;
      }

      .fullscreen-btn {
        position: absolute;
        top: 12px;
        left: 14px;
        z-index: 60;
        min-height: 38px;
        padding: 8px 12px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.3);
        color: #fff;
        font-size: 12px;
        font-weight: 800;
        backdrop-filter: blur(8px);
      }

      .fullscreen-btn:hover {
        background: rgba(0, 0, 0, 0.44);
      }

      .sound-settings-btn {
        position: absolute;
        top: 12px;
        left: 126px;
        z-index: 61;
        width: 38px;
        height: 38px;
        min-height: 38px;
        padding: 0;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.3);
        color: #fff;
        font-size: 16px;
        font-weight: 800;
        backdrop-filter: blur(8px);
      }

      .sound-settings-btn:hover {
        background: rgba(0, 0, 0, 0.44);
      }

      .sound-controls {
        position: absolute;
        top: 12px;
        left: 172px;
        z-index: 60;
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 38px;
        padding: 5px 7px 5px 5px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.38);
        color: #fff;
        backdrop-filter: blur(10px);
        opacity: 0;
        visibility: hidden;
        transform: translateX(-8px) scale(0.98);
        transform-origin: left center;
        pointer-events: none;
        transition:
          opacity 0.18s ease,
          transform 0.18s ease,
          visibility 0.18s ease;
      }

      .sound-controls.open {
        opacity: 1;
        visibility: visible;
        transform: translateX(0) scale(1);
        pointer-events: auto;
      }

      .sound-btn,
      .sound-close-btn {
        min-height: 28px;
        padding: 6px 9px;
        border: 0;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
        font-size: 11px;
        font-weight: 800;
        white-space: nowrap;
      }

      .sound-close-btn {
        width: 28px;
        min-width: 28px;
        padding: 0;
        font-size: 15px;
      }

      .sound-btn:hover,
      .sound-close-btn:hover {
        background: rgba(255, 255, 255, 0.16);
      }

      .volume-slider {
        width: 92px;
        accent-color: var(--accent);
        cursor: pointer;
      }

      .volume-value {
        min-width: 34px;
        color: rgba(255, 255, 255, 0.82);
        font-size: 10px;
        font-weight: 800;
        text-align: right;
      }

      .end-card {
        position: absolute;
        inset: 0;
        z-index: 80;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: rgba(2, 8, 16, 0.62);
        backdrop-filter: blur(8px);
      }

      .end-card.visible {
        display: flex;
      }

      .end-panel {
        width: min(430px, 100%);
        padding: 26px;
        border: 1px solid var(--border);
        border-radius: 24px;
        background: rgba(6, 16, 30, 0.96);
        text-align: center;
      }

      .end-panel h2 {
        margin: 0 0 10px;
        font-size: 26px;
      }
      .end-panel p {
        margin: 0 0 18px;
        color: var(--muted);
        line-height: 1.55;
      }

      /* =========================================================
       MOBILE
       3 dan 4 karakter dibuat sedikit overlap agar tidak terlihat terlalu kecil.
       ========================================================= */
      @media (max-width: 640px) {
        .progress {
          top: 8px;
          right: 9px;
        }

        .fullscreen-btn {
          top: 8px;
          left: 9px;
          min-height: 34px;
          padding: 7px 10px;
          font-size: 11px;
        }

        .sound-controls {
          top: 8px;
          left: 112px;
          min-height: 34px;
          gap: 5px;
          padding: 4px 7px 4px 4px;
        }

        .sound-btn {
          min-height: 26px;
          padding: 5px 7px;
          font-size: 10px;
        }

        .volume-slider {
          width: 62px;
        }
        .volume-value {
          min-width: 28px;
          font-size: 9px;
        }

        .stage {
          inset: 4px 0 194px;
        }

        .character {
          height: 100%;
          object-fit: contain;
          object-position: center bottom;
        }

        .stage.layout-1 .slot-1 {
          left: 12%;
          width: 76%;
        }

        .stage.layout-2 .slot-1 {
          left: 0;
          width: 48%;
        }
        .stage.layout-2 .slot-2 {
          left: 52%;
          width: 48%;
        }

        .stage.layout-3 .slot-1 {
          left: -8%;
          width: 40%;
        }
        .stage.layout-3 .slot-2 {
          left: 30%;
          width: 40%;
        }
        .stage.layout-3 .slot-3 {
          left: 68%;
          width: 40%;
        }

        .stage.layout-4 .slot-1 {
          left: -8%;
          width: 32%;
        }
        .stage.layout-4 .slot-2 {
          left: 18%;
          width: 32%;
        }
        .stage.layout-4 .slot-3 {
          left: 44%;
          width: 32%;
        }
        .stage.layout-4 .slot-4 {
          left: 70%;
          width: 32%;
        }

        .stage.layout-4 #char-manager {
          --char-scale: 0.88;
          --char-active-scale: 0.915;
        }
        .stage.layout-4 #char-eve {
          --char-scale: 0.9;
          --char-active-scale: 0.935;
        }
        .stage.layout-4 #char-ai {
          --char-scale: 0.98;
          --char-active-scale: 1.015;
        }
        .stage.layout-4 #char-aya {
          --char-scale: 0.96;
          --char-active-scale: 0.995;
        }

        .expression-particle {
          width: clamp(88px, 28vw, 132px);
        }

        .dialogue {
          left: 7px;
          right: 7px;
          bottom: 7px;
          max-height: 184px;
          overflow-y: auto;
          padding: 11px;
          border-radius: 17px;
        }

        .speaker {
          min-height: 28px;
          padding: 5px 10px;
          font-size: 12px;
        }

        .text-box {
          margin-top: 7px;
          min-height: 58px;
          font-size: 13px;
          line-height: 1.48;
        }

        .actions {
          margin-top: 7px;
        }
        .hint {
          display: none;
        }
        .controls {
          width: 100%;
        }
        button {
          flex: 1;
          min-height: 42px;
          padding: 9px 12px;
        }

        .end-panel {
          padding: 21px 17px;
          border-radius: 20px;
        }
        .end-panel h2 {
          font-size: 22px;
        }
        .end-panel p {
          font-size: 13px;
        }
      }

      @media (max-width: 430px) {
        .sound-controls {
          right: 8px;
          left: auto;
          top: 48px;
        }
        .volume-slider {
          width: 78px;
        }
      }

      @media (max-width: 380px) {
        .stage {
          inset: 4px 0 190px;
        }
        .dialogue {
          max-height: 180px;
        }
        .text-box {
          font-size: 12.5px;
        }
      }

      @media (orientation: landscape) and (max-height: 560px) {
        .stage {
          inset: 2px 0 132px;
        }
        .dialogue {
          left: 8px;
          right: 8px;
          bottom: 6px;
          max-height: 126px;
          padding: 8px 10px;
        }
        .speaker {
          min-height: 25px;
          padding: 4px 9px;
        }
        .text-box {
          margin-top: 5px;
          min-height: 38px;
          font-size: 12.5px;
          line-height: 1.38;
        }
        .actions {
          margin-top: 5px;
        }
        button {
          min-height: 34px;
          padding: 7px 10px;
        }
      }

      /* =========================================================
         VN OVERLAY LAYOUT — characters continue behind dialogue
         Mobile controls are compact and proportionally spaced.
         ========================================================= */

      /* Let character artwork use the whole frame. The dialogue box now
         sits in front of the models instead of reserving empty space. */
      .stage {
        inset: 8px 0 0;
      }

      .character {
        bottom: 0;
        height: calc(100% - 6px);
      }

      .dialogue {
        z-index: 40;
        background: rgba(6, 16, 30, 0.9);
      }

      /* Keep utility controls above characters/dialogue without taking
         visual focus away from the scene. */
      .fullscreen-btn,
      .sound-settings-btn,
      .sound-controls,
      .progress {
        z-index: 70;
      }

      @media (max-width: 640px) {
        /* Full-height character stage; lower body can naturally disappear
           behind the dialogue panel like a conventional visual novel. */
        .stage {
          inset: 0;
        }

        .character {
          bottom: 0;
          height: 92%;
          max-height: none;
          object-fit: contain;
          object-position: center bottom;
        }

        /* 1 character */
        .stage.layout-1 .slot-1 {
          left: 8%;
          width: 84%;
        }

        /* 2 characters */
        .stage.layout-2 .slot-1 {
          left: -4%;
          width: 58%;
        }
        .stage.layout-2 .slot-2 {
          left: 46%;
          width: 58%;
        }

        /* 3 characters: intentionally overlap a little so models stay large. */
        .stage.layout-3 .slot-1 {
          left: -10%;
          width: 46%;
        }
        .stage.layout-3 .slot-2 {
          left: 27%;
          width: 46%;
        }
        .stage.layout-3 .slot-3 {
          left: 64%;
          width: 46%;
        }

        /* 4 characters: tighter overlap, still readable on narrow phones. */
        .stage.layout-4 .slot-1 {
          left: -15%;
          width: 39%;
        }
        .stage.layout-4 .slot-2 {
          left: 10%;
          width: 39%;
        }
        .stage.layout-4 .slot-3 {
          left: 35%;
          width: 39%;
        }
        .stage.layout-4 .slot-4 {
          left: 60%;
          width: 39%;
        }

        /* Compact mobile top bar. Fullscreen becomes icon-only. */
        .fullscreen-btn {
          top: 8px;
          left: 8px;
          width: 40px;
          height: 40px;
          min-height: 40px;
          padding: 0;
          font-size: 0;
          display: grid;
          place-items: center;
          border-radius: 12px;
        }

        .fullscreen-btn::before {
          content: "⛶";
          font-size: 18px;
          line-height: 1;
        }

        .sound-settings-btn {
          top: 8px;
          left: 56px;
          width: 40px;
          height: 40px;
          min-height: 40px;
          padding: 0;
          display: grid;
          place-items: center;
          border-radius: 12px;
          font-size: 17px;
          line-height: 1;
        }

        .progress {
          top: 8px;
          right: 8px;
          min-height: 40px;
          display: flex;
          align-items: center;
          padding: 0 11px;
          border-radius: 12px;
          font-size: 10px;
        }

        /* Sound panel opens below the two utility icons instead of stretching
           across or colliding with the top controls. */
        .sound-controls,
        .sound-controls.open {

      function normalizeExpressionName(value) {
        return String(value || "basic")

        const el = dom.chars[characterKey];

        const expression = normalizeExpressionName(expressionName);
        const map = CHARACTER_EXPRESSIONS[characterKey] || {};
        const desired =
          map[expression] || map.basic || CHARACTER_BASIC[characterKey];
        const fallback = map.basic || CHARACTER_BASIC[characterKey];

        el.dataset.expression = expression;
        el.dataset.fallbackSrc = fallback;

        if (el.getAttribute("src") !== desired) {
          el.setAttribute("src", desired);
        }
      }

      Object.entries(dom.chars).forEach(function ([key, el]) {
        el.addEventListener("error", function () {
          const fallback = el.dataset.fallbackSrc || CHARACTER_BASIC[key];
          if (fallback && el.getAttribute("src") !== fallback) {
            el.setAttribute("src", fallback);

      const PARTICLE_ASSETS = {

      // Posisi kepala relatif terhadap bounding box masing-masing gambar.

      const CHARACTER_HEAD_POSITION = {
        manager: { x: 0.7, y: 0.12, offsetX: 0, offsetY: -10 },
        eve: { x: 0.6, y: 0.18, offsetX: 0, offsetY: -10 },
        ai: { x: 0.6, y: 0.18, offsetX: 0, offsetY: -10 },
        aya: { x: 0.6, y: 0.12, offsetX: 0, offsetY: -10 },
      };

      function particleMoodForMode(mode) {
        const value = normalizeExpressionName(mode);

        if (value === "angry") return "angry";
        if (value === "sad" || value === "depressed" || value === "shy")
          return "sad";
        if (
          value === "happy" ||
          value === "excited" ||
          value === "amazed" ||
          value === "proud"
        )
          return "happy";

        return null;
      }

      function hideExpressionParticle() {
        const particle = dom.expressionParticle;
        if (!particle) return;
        particle.className = "expression-particle";
        particle.removeAttribute("src");
      }

      function positionExpressionParticle(step) {
        const particle = dom.expressionParticle;
        if (!particle || !step || !step.active) {
          hideExpressionParticle();
          return;
        }

        const activeKey = step.active;
        const character = dom.chars[activeKey];
        if (!character || !character.classList.contains("visible")) {
          hideExpressionParticle();
          return;
        }

        const mode = getCharacterMode(step, activeKey);
        const mood = particleMoodForMode(mode);
        const source = PARTICLE_ASSETS[mood];

        if (!source) {
          hideExpressionParticle();
          return;
        }

        const stageRect = dom.stage.getBoundingClientRect();
        const charRect = character.getBoundingClientRect();
        const head = CHARACTER_HEAD_POSITION[activeKey] || {
          x: 0.5,
          y: 0.18,
          offsetX: 0,
          offsetY: -10,
        };

        const left =
          charRect.left -
          stageRect.left +
          charRect.width * head.x +
          head.offsetX;
        const top =
          charRect.top -
          stageRect.top +
          charRect.height * head.y +
          head.offsetY;

        particle.style.left = `${left}px`;
        particle.style.top = `${top}px`;
        particle.className = `expression-particle visible particle-${mood}`;

        if (particle.getAttribute("src") !== source) {
          particle.setAttribute("src", source);
        }

        particle.onerror = function () {
          console.warn(`Particle ${mood} tidak ditemukan: ${source}`);
          hideExpressionParticle();
        };
      }

      let particleResizeFrame = null;
      function refreshParticlePosition() {
        if (particleResizeFrame) cancelAnimationFrame(particleResizeFrame);
        particleResizeFrame = requestAnimationFrame(function () {
          positionExpressionParticle(steps[current]);

      /* =========================================================
       SOUND & EXPRESSION ENGINE
       Tidak membutuhkan file MP3/WAV. SFX dibuat dengan Web Audio API.
       Volume diatur oleh sfxVolume (0.0 - 1.0) dan slider UI 0 - 100%.
       Browser mobile baru mengaktifkan audio setelah tap pertama.
       ========================================================= */
      let audioContext = null;
      let soundEnabled = localStorage.getItem("kurabuSfxMuted") !== "true";
      let audioUnlocked = false;
      let sfxVolume = Math.min(
        1,
        Math.max(
          0,
          Number(localStorage.getItem("kurabuSfxVolume") || "70") / 100,
        ),
      );

      const EXPRESSION_BY_TEXT = {
        "Gak mau.": "deadpan",
        "Oke, deal!": "happy",
        "Aku Eve! Salam kenal, manager!": "happy",
        "Suara siapa ini? Indah sekali! Membuatku merasa berapi-api!":

        "Iya, iya! Bener banget!": "happy",
        "Uh… um… anu…": "shy",
        "Maaf aku pemalu. Apakah tidak apa-apa kalau aku jadi idol?": "shy",
        "Oke baiklah! Terima kasih banyak manager! Nama ku Ai. Salam kenal!":
          "happy",
        "Tunggu, tunggu! Aku juga mau jadi idol!!": "surprise",
        "Iya, mau! Aku Aya, salam kenal!": "excited",
        "Gimana sih kalian?! Kalian harusnya ngikutin tempo ku!": "angry",
        "Kamu gak bisa nyalahin kita gitu dong! Kan kita juga baru ketemu! Wajar aja kalau kita belum ketemu kemistrinya!":
          "angry",
        "Itu mah kalian aja yang amatiran! Kalian beneran mau gak sih jadi idol?!":
          "angry",
        "Kalian berdua jangan bertengkar!! Kita seharusnya menjalin hubungan dengan baik, agar kita bisa bekerja sama sebagai unit idol!":
          "angry",
        "Dia benar. Maaf kalian berdua. Aku terbawa suasana.": "shy",
        "Aku juga minta maaf. Aku terlalu naif.": "shy",
        "Baiklah! Ayo kita coba lagi dari awal!": "happy",
      };

      function getAudioContext() {
        if (!audioContext) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return null;
          audioContext = new AudioCtx();
        }
        return audioContext;
      }

      async function unlockAudio() {
        if (!soundEnabled) return;
        const ctx = getAudioContext();
        if (!ctx) return;
        try {
          if (ctx.state === "suspended") await ctx.resume();
          audioUnlocked = ctx.state === "running";
        } catch (_) {}
      }

      function tone({
        frequency = 440,
        duration = 0.055,
        volume = 0.035,
        type = "sine",
        delay = 0,
        endFrequency = null,
      }) {
        if (!soundEnabled || !audioUnlocked) return;
        const ctx = getAudioContext();
        if (!ctx || ctx.state !== "running") return;

        const start = ctx.currentTime + delay;
        const end = start + duration;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = type;
        osc.frequency.setValueAtTime(frequency, start);
        if (endFrequency)
          osc.frequency.exponentialRampToValueAtTime(
            Math.max(30, endFrequency),
            end,
          );

        gain.gain.setValueAtTime(0.0001, start);
        const finalVolume = Math.max(0.0001, volume * sfxVolume);
        gain.gain.exponentialRampToValueAtTime(
          finalVolume,
          start + Math.min(0.015, duration / 3),
        );
        gain.gain.exponentialRampToValueAtTime(0.0001, end);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(start);
        osc.stop(end + 0.02);
      }

      function playDialogueSound(speaker) {
        if (!soundEnabled || !audioUnlocked || speaker === "Narasi") return;

        const pitch =
          {
            "Mane-chan": 390,
            Manager: 390,
            Eve: 560,
            Gadis: 520,
            Ai: 650,
            Aya: 720,
            "???": 700,
          }[speaker] || 500;

        tone({
          frequency: pitch,
          duration: 0.045,
          volume: 0.022,
          type: "triangle",
        });
        tone({
          frequency: pitch * 1.08,
          duration: 0.04,
          volume: 0.014,
          type: "sine",
          delay: 0.055,
        });
      }

      function playExpressionSound(expression) {
        if (!soundEnabled || !audioUnlocked || !expression) return;

        if (expression === "happy" || expression === "proud") {
          tone({
            frequency: 620,
            endFrequency: 880,
            duration: 0.11,
            volume: 0.026,
            type: "sine",
          });
          tone({
            frequency: 880,
            duration: 0.08,
            volume: 0.018,
            type: "sine",
            delay: 0.09,
          });
        } else if (expression === "excited") {
          tone({
            frequency: 460,
            endFrequency: 920,
            duration: 0.16,
            volume: 0.028,
            type: "triangle",
          });
        } else if (
          expression === "surprise" ||
          expression === "surprised" ||
          expression === "shocked" ||
          expression === "amazed"
        ) {
          tone({
            frequency: 920,
            endFrequency: 1450,
            duration: 0.09,
            volume: 0.025,
            type: "square",
          });
        } else if (expression === "angry") {
          tone({
            frequency: 155,
            endFrequency: 105,
            duration: 0.12,
            volume: 0.035,
            type: "sawtooth",
          });
          tone({
            frequency: 125,
            duration: 0.08,
            volume: 0.022,
            type: "square",
            delay: 0.07,
          });
        } else if (expression === "shy" || expression === "sad") {
          tone({
            frequency: 410,
            endFrequency: 330,
            duration: 0.13,
            volume: 0.018,
            type: "sine",
          });
        } else if (expression === "deadpan" || expression === "depressed") {
          tone({
            frequency: 245,
            endFrequency: 220,
            duration: 0.08,
            volume: 0.016,
            type: "triangle",
          });
        }
      }

      function getExpression(step) {
        return step.expression || EXPRESSION_BY_TEXT[step.text] || null;
      }

      function getCharacterMode(step, characterKey) {
        if (step.expressions && step.expressions[characterKey]) {
          return normalizeExpressionName(step.expressions[characterKey]);
        }

        if (step.active === characterKey) {
          const inferred = getExpression(step);
          if (inferred) return normalizeExpressionName(inferred);
        }

        return "basic";
      }

      function applyExpression(step) {
        const expression = getExpression(step);
        if (!expression || !step.active) return;
        const el = dom.chars[step.active];
        if (!el) return;

        // restart animation even when same expression appears twice in a row
        el.classList.remove(
          "expr-happy",
          "expr-excited",
          "expr-surprise",
          "expr-surprised",
          "expr-shocked",
          "expr-amazed",
          "expr-angry",
          "expr-shy",
          "expr-sad",
          "expr-depressed",
          "expr-proud",
          "expr-deadpan",
        );
        void el.offsetWidth;

        const animationAlias =
          {
            surprised: "surprise",
            shocked: "surprise",
            amazed: "surprise",
            sad: "shy",
            depressed: "deadpan",
            proud: "happy",
          }[expression] || expression;

        el.classList.add(`expr-${animationAlias}`);
      }

      function playStepSound(step) {
        playDialogueSound(step.speaker || "Narasi");
        const expression = getExpression(step);
        if (expression) {
          window.setTimeout(function () {
            playExpressionSound(expression);
          }, 45);
        }
      }

      const bgCache = {};
      let current = 0;
      let currentBackgroundKey = null;
      let currentBackgroundSource = null;

      function paintBackground(source, fallback) {
        dom.background.style.backgroundImage = "none";
        dom.background.style.backgroundColor = "#07182b";
        dom.background.style.backgroundRepeat = "no-repeat";
        dom.background.style.backgroundPosition = "center center";
        dom.background.style.backgroundSize = "100% 100%";
        dom.background.style.background = fallback;

        if (source) {
          dom.background.style.backgroundImage = `url("${source}")`;
        }
      }

      function applyBackground(bgKey) {
        const key = bgKey || "opening";
        const fallback = FALLBACKS[key] || FALLBACKS.opening;
        const source = BACKGROUNDS[key] || null;

        if (currentBackgroundKey === key && currentBackgroundSource === source) {
          return;
        }

        currentBackgroundKey = key;
        currentBackgroundSource = source;
        paintBackground(null, fallback);

        if (!source) return;

        if (bgCache[source] === true) {
          paintBackground(source, fallback);
          return;
        }

        if (bgCache[source] === false) {
          return;
        }

        const image = new Image();
        image.onload = function () {
          bgCache[source] = true;
          if (currentBackgroundKey === key && currentBackgroundSource === source) {
            paintBackground(source, fallback);
          }
        };
        image.onerror = function () {
          bgCache[source] = false;
        };
        image.src = source;
      }

      function isPhoneLayout() {
        return (
          window.matchMedia && window.matchMedia("(max-width: 640px)").matches
        );
      }

      function getCharacterKeyFromSpeaker(speaker) {
        return (
          {
            "Mane-chan": "manager",
            Eve: "eve",
            Ai: "ai",
            Aya: "aya",
          }[speaker] || null
        );
      }

      let lastMobileFocusCharacter = "manager";

      function getMobileVisibleCharacters(step, shown) {
        if (!isPhoneLayout()) return shown.slice();

        const active = step.active && dom.chars[step.active] ? step.active : null;
        const fromSpeaker = getCharacterKeyFromSpeaker(step.speaker);

        let focus = active || fromSpeaker || null;

        if (!focus && shown.includes(lastMobileFocusCharacter)) {
          focus = lastMobileFocusCharacter;
        }

        if (!focus && shown.length) {
          focus = shown[0];
        }

        if (!focus) {
          focus = lastMobileFocusCharacter || "manager";
        }

        lastMobileFocusCharacter = focus;
        return [focus];
      }

      function applyCharacters(step) {
        const originalShown = Array.isArray(step.show) ? step.show : [];
        const shown = getMobileVisibleCharacters(step, originalShown);
        const count = isPhoneLayout()
          ? 1
          : Math.min(Math.max(shown.length, 1), 4);

        Object.keys(dom.chars).forEach(function (key) {
          setCharacterExpression(key, getCharacterMode(step, key));
        });

        dom.stage.className = `stage layout-${count}`;

        Object.values(dom.chars).forEach(function (el) {
          el.className = "character";
        });

        shown.forEach(function (key, index) {
          const el = dom.chars[key];
          if (!el) return;

          el.classList.add("visible", `slot-${index + 1}`);

          if (step.active === key) {
            el.classList.add("active");
          } else if (step.active) {
            el.classList.add("dim");
          }
        });
      }

      function getDialogueThemeKey(step) {
        if (step && step.active && dom.chars[step.active]) return step.active;

        const fromSpeaker = getCharacterKeyFromSpeaker(step && step.speaker);
        if (fromSpeaker) return fromSpeaker;

        return "narrator";
      }

      function applyDialogueTheme(step) {
        dom.app.classList.remove(
          "theme-narrator",
          "theme-manager",
          "theme-eve",
          "theme-ai",
          "theme-aya",
        );

        const themeKey = getDialogueThemeKey(step);
        dom.app.classList.add(`theme-${themeKey}`);
      }

      function render() {
        const step = steps[current];

        applyBackground(step.bgKey);
        applyCharacters(step);
        applyDialogueTheme(step);
        applyExpression(step);
        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            positionExpressionParticle(step);
          });
        });

        dom.progress.textContent = `${current + 1} / ${steps.length}`;
        dom.speaker.textContent = step.speaker || "Narasi";
        dom.speaker.className =
          "speaker" +
          (step.speaker === "Narasi" || !step.speaker ? " narrator" : "");
        dom.text.textContent = step.text;
        playStepSound(step);

        dom.prevBtn.disabled = current === 0;
        dom.prevBtn.style.opacity = current === 0 ? ".45" : "1";
        dom.nextBtn.textContent = step.end ? "Selesai" : "Next";

        dom.endCard.classList.toggle(
          "visible",
          !!step.end && current === steps.length - 1,
        );
      }

      async function next() {
        await unlockAudio();
        if (current < steps.length - 1) {
          current += 1;
          render();
        }
      }

      async function previous() {
        await unlockAudio();
        if (current > 0) {
          current -= 1;
          render();
        }
      }

      dom.nextBtn.addEventListener("click", next);
      dom.prevBtn.addEventListener("click", previous);

      function updateSoundUI() {
        const percent = Math.round(sfxVolume * 100);
        dom.volumeSlider.value = String(percent);
        dom.volumeValue.textContent = `${percent}%`;
        dom.soundBtn.textContent =
          soundEnabled && percent > 0 ? "🔊 Sound" : "🔇 Muted";
        dom.soundBtn.setAttribute(
          "aria-label",
          soundEnabled && percent > 0 ? "Matikan suara" : "Aktifkan suara",
        );
        dom.soundSettingsBtn.textContent =
          soundEnabled && percent > 0 ? "🔊" : "🔇";
      }

      function setSoundPanel(open) {
        dom.soundControls.classList.toggle("open", open);
        dom.soundControls.setAttribute("aria-hidden", String(!open));
        dom.soundSettingsBtn.setAttribute("aria-expanded", String(open));
        dom.soundSettingsBtn.setAttribute(
          "aria-label",
          open ? "Tutup pengaturan suara" : "Buka pengaturan suara",
        );
      }

      dom.soundSettingsBtn.addEventListener("click", function (event) {
        event.stopPropagation();
        setSoundPanel(!dom.soundControls.classList.contains("open"));
      });

      dom.soundCloseBtn.addEventListener("click", function (event) {
        event.stopPropagation();
        setSoundPanel(false);
      });

      dom.soundBtn.addEventListener("click", async function (event) {
        event.stopPropagation();
        soundEnabled = !soundEnabled;
        localStorage.setItem("kurabuSfxMuted", String(!soundEnabled));

        if (soundEnabled && sfxVolume === 0) {
          sfxVolume = 0.7;
          localStorage.setItem("kurabuSfxVolume", "70");
        }

        updateSoundUI();

        if (soundEnabled) {
          await unlockAudio();
          tone({
            frequency: 660,
            endFrequency: 820,
            duration: 0.1,
            volume: 0.025,
            type: "sine",
          });
        }
      });

      dom.volumeSlider.addEventListener("input", async function (event) {
        event.stopPropagation();
        sfxVolume = Number(dom.volumeSlider.value) / 100;
        localStorage.setItem(
          "kurabuSfxVolume",
          String(Math.round(sfxVolume * 100)),
        );

        soundEnabled = sfxVolume > 0;
        localStorage.setItem("kurabuSfxMuted", String(!soundEnabled));
        updateSoundUI();

        if (soundEnabled) await unlockAudio();
      });

      dom.volumeSlider.addEventListener("change", async function (event) {
        event.stopPropagation();
        if (!soundEnabled) return;
        await unlockAudio();
        tone({
          frequency: 600,
          endFrequency: 760,
          duration: 0.08,
          volume: 0.025,
          type: "sine",
        });
      });

      dom.soundControls.addEventListener("click", function (event) {
        event.stopPropagation();
      });

      function setDialogVisible(visible) {
        dom.app.classList.toggle("dialog-hidden", !visible);
        if (dom.dialogCloseBtn)
          dom.dialogCloseBtn.setAttribute("aria-expanded", String(visible));
        requestAnimationFrame(function () {
          if (typeof refreshParticlePosition === "function")
            refreshParticlePosition();
        });
      }

      if (dom.dialogCloseBtn) {
        dom.dialogCloseBtn.addEventListener("click", function (event) {
          event.stopPropagation();
          setDialogVisible(false);
        });
      }

      if (dom.dialogShowBtn) {
        dom.dialogShowBtn.addEventListener("click", function (event) {
          event.stopPropagation();
          setDialogVisible(true);
        });
      }

      window.addEventListener("resize", function () {
        applyCharacters(steps[current]);
        requestAnimationFrame(function () {
          if (typeof refreshParticlePosition === "function")
            refreshParticlePosition();
        });
      });

      dom.restartBtn.addEventListener("click", function () {
        current = 0;
        dom.endCard.classList.remove("visible");
        render();
      });

      dom.app.addEventListener("click", function (event) {
        if (event.target.closest("button")) return;
        if (dom.endCard.classList.contains("visible")) return;
        next();
      });

      window.addEventListener("keydown", function (event) {
        if (
          event.key === "ArrowRight" ||
          event.key === " " ||
          event.key === "Enter"
        ) {
          event.preventDefault();
          next();
        }

        if (event.key === "ArrowLeft") {
          event.preventDefault();
          previous();
        }
      });

      function isFullscreen() {
        return Boolean(
          document.fullscreenElement ||
          document.webkitFullscreenElement ||
          document.msFullscreenElement,
        );
      }

      function updateFullscreenButton() {
        if (!dom.fullscreenBtn) return;
        dom.fullscreenBtn.textContent = isFullscreen()
          ? "↙ Exit Fullscreen"
          : "⛶ Fullscreen";
        dom.fullscreenBtn.setAttribute(
          "aria-label",
          isFullscreen() ? "Keluar dari fullscreen" : "Buka fullscreen",
        );
      }

      async function toggleFullscreen() {
        const target = document.documentElement;

        try {
          if (!isFullscreen()) {
            if (target.requestFullscreen) {
              await target.requestFullscreen();
            } else if (target.webkitRequestFullscreen) {
              target.webkitRequestFullscreen();
            } else if (target.msRequestFullscreen) {
              target.msRequestFullscreen();
            }
          } else {
            if (document.exitFullscreen) {
              await document.exitFullscreen();
            } else if (document.webkitExitFullscreen) {
              document.webkitExitFullscreen();
            } else if (document.msExitFullscreen) {
              document.msExitFullscreen();
            }
          }
        } catch (error) {
          console.warn("Fullscreen tidak dapat diaktifkan:", error);
        }
      }

      dom.fullscreenBtn.addEventListener("click", function (event) {
        event.stopPropagation();
        toggleFullscreen();
      });

      document.addEventListener("fullscreenchange", updateFullscreenButton);
      document.addEventListener(
        "webkitfullscreenchange",
        updateFullscreenButton,
      );
      document.addEventListener("MSFullscreenChange", updateFullscreenButton);
      window.addEventListener("resize", refreshParticlePosition);
      document.addEventListener("fullscreenchange", refreshParticlePosition);
      document.addEventListener(
        "webkitfullscreenchange",
        refreshParticlePosition,
      );
      updateFullscreenButton();
      updateSoundUI();
      dom.app.classList.add("theme-narrator");

      render();
    </script>
  </body>
</html>
